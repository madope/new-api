<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISURELINK</title>
  <meta
    name="description"
    content="ISURELINK 一站式大模型 API 网关，提供专业稳定的大模型 API 服务。"
  >
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4ff;
      --bg-deep: #dfe9ff;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --panel-border: rgba(107, 138, 204, 0.18);
      --text: #101828;
      --muted: #4b5b76;
      --brand-a: #18c7ff;
      --brand-b: #4361ee;
      --brand-c: #0f172a;
      --shadow: 0 32px 80px rgba(66, 95, 160, 0.18);
      --glow: 0 0 120px rgba(24, 199, 255, 0.22);
      --iframe-bg: #f7f9fc;
    }

    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #07111f;
      --bg-deep: #0d1b31;
      --panel: rgba(10, 18, 33, 0.72);
      --panel-strong: rgba(9, 17, 31, 0.88);
      --panel-border: rgba(122, 162, 255, 0.18);
      --text: #edf4ff;
      --muted: #9eb3cf;
      --brand-a: #5ee7ff;
      --brand-b: #5b7cff;
      --brand-c: #dce8ff;
      --shadow: 0 32px 90px rgba(0, 0, 0, 0.46);
      --glow: 0 0 160px rgba(24, 199, 255, 0.16);
      --iframe-bg: #081120;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      position: relative;
      overflow-x: hidden;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(24, 199, 255, 0.22), transparent 28%),
        radial-gradient(circle at 78% 24%, rgba(67, 97, 238, 0.18), transparent 26%),
        radial-gradient(circle at 72% 82%, rgba(102, 126, 234, 0.14), transparent 32%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      background:
        radial-gradient(circle at 24% 30%, rgba(94, 231, 255, 0.18), transparent 24%),
        radial-gradient(circle at 76% 26%, rgba(91, 124, 255, 0.12), transparent 22%);
      filter: blur(56px);
      opacity: 0.8;
    }

    .shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(360px, 520px);
      gap: 40px;
      align-items: center;
      min-height: 100vh;
      padding: 40px clamp(20px, 4vw, 56px);
    }

    .hero {
      display: flex;
      justify-content: center;
    }

    .hero-card {
      width: min(100%, 720px);
      padding: clamp(20px, 2vw, 28px);
    }

    .hero-title {
      margin: 28px 0 18px;
      font-size: clamp(3rem, 8vw, 6.2rem);
      line-height: 0.94;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 900;
      color: transparent;
      background:
        linear-gradient(135deg, var(--brand-a) 4%, var(--brand-b) 42%, var(--brand-c) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 18px 40px rgba(67, 97, 238, 0.08);
    }

    .hero-subtitle {
      max-width: 18em;
      margin: 0;
      font-size: clamp(1.08rem, 2vw, 1.45rem);
      line-height: 1.8;
      letter-spacing: 0.03em;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .login-panel {
      display: flex;
      justify-content: center;
    }

    .login-card {
      width: min(100%, 520px);
      padding: 0;
    }

    .iframe-wrap {
      min-height: 720px;
      border-radius: 24px;
      overflow: hidden;
      background: var(--iframe-bg);
      box-shadow: var(--shadow);
    }

    .signin-frame {
      display: block;
      width: 100%;
      min-height: 720px;
      border: 0;
      background: transparent;
    }

    @media (max-width: 1080px) {
      .shell {
        grid-template-columns: 1fr;
        gap: 28px;
        padding-top: 28px;
        padding-bottom: 36px;
      }

      .hero {
        justify-content: stretch;
      }

      .hero-card,
      .login-card {
        width: min(100%, 720px);
        margin: 0 auto;
      }
    }

    @media (max-width: 720px) {
      .shell {
        padding-inline: 16px;
      }

      .hero-card {
        border-radius: 26px;
      }

      .login-card {
        border-radius: 26px;
      }

      .iframe-wrap,
      .signin-frame {
        min-height: 650px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-label="品牌介绍">
      <div class="hero-card">
        <h1 class="hero-title">ISURELINK</h1>
        <p class="hero-subtitle">
          一站式大模型 API 网关，提供专业稳定的大模型 API 服务
        </p>
      </div>
    </section>

    <section class="login-panel" aria-label="登录区域">
      <div class="login-card">
        <div class="iframe-wrap">
          <iframe
            id="signin-frame"
            class="signin-frame"
            title="ISURELINK Sign In"
            referrerpolicy="strict-origin-when-cross-origin"
            loading="eager"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var frame = document.getElementById('signin-frame');
      var explicitBase = params.get('base') || params.get('site') || '';
      var explicitPath = params.get('path') || '/embedded-sign-in';
      var redirect = params.get('redirect') || '';
      var lang = document.documentElement.lang || 'zh-CN';

      function normalizeBase(input) {
        if (!input) return '';
        try {
          var url = new URL(input);
          return url.origin.replace(/\/+$/, '');
        } catch (_error) {
          return '';
        }
      }

      function resolveBase() {
        var base = normalizeBase(explicitBase);
        if (base) return base;
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          return window.location.origin.replace(/\/+$/, '');
        }
        return '';
      }

      function buildSignInUrl() {
        var base = resolveBase();
        if (!base) return '';
        var cleanPath = explicitPath.startsWith('/') ? explicitPath : '/' + explicitPath;
        var url = new URL(base + cleanPath);
        if (redirect) {
          url.searchParams.set('redirect', redirect);
        }
        return url.toString();
      }

      function applyTheme(themeMode) {
        var normalized = themeMode === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', normalized);
      }

      function applyLang(nextLang) {
        if (!nextLang || typeof nextLang !== 'string') return;
        lang = nextLang;
        document.documentElement.lang = nextLang;
      }

      var signInUrl = buildSignInUrl();
      if (signInUrl) {
        frame.src = signInUrl;
      }

      window.addEventListener('message', function (event) {
        var data = event && event.data;
        if (!data || typeof data !== 'object') return;
        if (typeof data.themeMode === 'string') {
          applyTheme(data.themeMode);
        }
        if (typeof data.lang === 'string') {
          applyLang(data.lang);
        }
      });

      if (params.get('theme') === 'dark') {
        applyTheme('dark');
      }
      if (params.get('lang')) {
        applyLang(params.get('lang'));
      }

      window.__ISURELINK_HOME__ = {
        lang: function () {
          return lang;
        },
        signInUrl: function () {
          return signInUrl;
        }
      };
    })();
  </script>
</body>
</html>
